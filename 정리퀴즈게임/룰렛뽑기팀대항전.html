<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>룰렛 뽑기 팀 대항전</title>
<style>
  :root{
    --paper:#f2efe6; --panel:#fffdf8; --panel-line:#e4ddc9;
    --ink:#242019; --ink-soft:#6b6355; --grid-line:rgba(60,50,20,0.07);
    --accent-sun:#c8720f; --accent-sun-glow:#e69a2e;
    --accent-good:#3f7d54; --accent-sky:#2a6fdb;
    --lcd-bg:#20261f; --lcd-text:#8ff0a4; --lcd-text-dim:#4f7a5c;
    --focus:#2f5fa8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14120d; --panel:#1e1b14; --panel-line:#3a3427;
      --ink:#efe9db; --ink-soft:#b3a98f; --grid-line:rgba(255,240,200,0.06);
      --accent-sun:#e69a2e; --accent-sun-glow:#f4b559;
      --accent-good:#6bc98a; --accent-sky:#7fabe0;
      --lcd-bg:#0f1a11; --lcd-text:#8ff0a4; --lcd-text-dim:#3f6b4c; --focus:#7fabe0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14120d; --panel:#1e1b14; --panel-line:#3a3427;
    --ink:#efe9db; --ink-soft:#b3a98f; --grid-line:rgba(255,240,200,0.06);
    --accent-sun:#e69a2e; --accent-sun-glow:#f4b559;
    --accent-good:#6bc98a; --accent-sky:#7fabe0;
    --lcd-bg:#0f1a11; --lcd-text:#8ff0a4; --lcd-text-dim:#3f6b4c; --focus:#7fabe0;
  }
  :root[data-theme="light"]{
    --paper:#f2efe6; --panel:#fffdf8; --panel-line:#e4ddc9;
    --ink:#242019; --ink-soft:#6b6355; --grid-line:rgba(60,50,20,0.07);
    --accent-sun:#c8720f; --accent-sun-glow:#e69a2e;
    --accent-good:#3f7d54; --accent-sky:#2a6fdb;
    --lcd-bg:#20261f; --lcd-text:#8ff0a4; --lcd-text-dim:#4f7a5c; --focus:#2f5fa8;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--paper);
    background-size:24px 24px, 24px 24px, auto;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 40px;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  .nameplate{ width:100%; max-width:1080px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .eyebrow{ font-family:'SFMono-Regular','Consolas',monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
  h1{ font-size:clamp(1.3rem, 1rem + 1.4vw, 1.9rem); font-weight:800; letter-spacing:-.01em; margin:2px 0 0; }
  .topbtns{ display:flex; gap:8px; }
  .iconbtn{ background:var(--panel); border:1px solid var(--panel-line); color:var(--ink); border-radius:10px; padding:8px 12px; font-size:.82rem; cursor:pointer; font-weight:700; }
  .iconbtn:hover{ border-color:var(--accent-sun); }

  .layout{ width:100%; max-width:1080px; display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:860px){ .layout{ grid-template-columns: 380px 1fr; } }

  .panel-box{ background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; box-shadow:0 10px 30px rgba(30,25,10,0.10); padding:20px; }

  /* --- 룰렛 영역 --- */
  .wheel-area{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .wheel-stage{ position:relative; width:min(340px, 78vw); height:min(340px, 78vw); }
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent;
    border-top:24px solid var(--accent-sun); z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  }
  .wheel{
    width:100%; height:100%; border-radius:50%; position:relative;
    box-shadow:0 0 0 8px var(--panel), 0 0 0 10px var(--panel-line), 0 8px 24px rgba(0,0,0,.25);
    transition: transform 3.2s cubic-bezier(.17,.67,.14,1);
  }
  .wheel-label{
    position:absolute; left:50%; top:50%; width:0; height:0;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .wheel-label span{
    display:block; transform:translateY(14px); width:64px; margin-left:-32px;
    text-align:center; font-weight:800; font-size:.78rem; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);
    line-height:1.2;
  }
  .wheel-hub{
    position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px;
    border-radius:50%; background:var(--panel); border:3px solid var(--accent-sun);
    display:flex; align-items:center; justify-content:center; font-size:1.4rem; z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .spin-btn{
    background:var(--accent-sun); color:#fff; border:none; border-radius:14px;
    padding:14px 32px; font-size:1.05rem; font-weight:800; cursor:pointer;
    box-shadow:0 6px 18px rgba(200,114,15,0.35);
  }
  .spin-btn:hover{ filter:brightness(1.08); }
  .spin-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .turn-badge{
    font-size:.9rem; font-weight:700; background:var(--paper); border:1px solid var(--panel-line);
    border-radius:999px; padding:8px 16px; color:var(--ink);
  }
  .turn-badge b{ color:var(--accent-sun); }

  .progress-note{ font-size:.78rem; color:var(--ink-soft); text-align:center; }

  /* --- 팀 스코어보드 --- */
  .team-setup{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .team-setup input[type=number]{ width:52px; padding:6px 8px; border-radius:8px; border:1px solid var(--panel-line); background:var(--paper); color:var(--ink); }
  .team-setup button{ background:var(--panel); border:1px solid var(--panel-line); border-radius:8px; padding:7px 12px; font-weight:700; cursor:pointer; color:var(--ink); }
  .team-setup button:hover{ border-color:var(--accent-sun); }

  .team-list{ display:grid; grid-template-columns:1fr; gap:10px; }
  .team-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--paper); border:1px solid var(--panel-line); border-radius:12px; padding:10px 14px;
  }
  .team-card.leading{ border-color:var(--accent-sun); box-shadow:0 0 0 1px var(--accent-sun) inset; }
  .team-name{
    font-weight:800; font-size:1rem; border:none; background:transparent; color:var(--ink);
    width:100%; max-width:140px;
  }
  .team-score-ctrl{ display:flex; align-items:center; gap:8px; }
  .team-score{
    font-family:'SFMono-Regular',monospace; font-weight:800; font-size:1.3rem; color:var(--accent-good);
    min-width:42px; text-align:right;
  }
  .pm-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--panel-line); background:var(--panel);
    color:var(--ink); font-weight:800; cursor:pointer; line-height:1;
  }
  .pm-btn:hover{ border-color:var(--accent-sun); }
  .crown{ font-size:1rem; }

  /* --- 모달 --- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(20,16,8,0.55);
    align-items:center; justify-content:center; z-index:10; padding:16px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px;
    padding:26px; max-width:520px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.35);
    text-align:center;
  }
  .modal .tag{
    display:inline-block; font-family:'SFMono-Regular',monospace; font-size:.72rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;
  }
  .modal h2{ font-size:1.3rem; margin:0 0 14px; }
  .modal .qtext{ font-size:1.15rem; font-weight:700; line-height:1.55; margin-bottom:16px; min-height:60px; display:flex; align-items:center; justify-content:center; }
  .modal .atext{
    display:none; background:var(--paper); border:1px dashed var(--panel-line); border-radius:12px;
    padding:14px; margin-bottom:16px; font-weight:700; color:var(--accent-good);
  }
  .modal .btnrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
  .modal .btn{ border:none; border-radius:12px; padding:12px 22px; font-weight:800; font-size:.95rem; cursor:pointer; background:var(--accent-sun); color:#fff; }
  .modal .btn.secondary{ background:var(--paper); color:var(--ink); border:1px solid var(--panel-line); }
  .award-row{ display:none; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  .award-row button{ border:1px solid var(--panel-line); background:var(--paper); color:var(--ink); border-radius:10px; padding:9px 14px; font-weight:700; cursor:pointer; }
  .award-row button:hover{ border-color:var(--accent-good); }
  .award-row .skip{ opacity:.75; }

  .hint{ margin-top:14px; font-size:.8rem; color:var(--ink-soft); text-align:center; max-width:1080px; }
</style>
</head>
<body>
  <div class="nameplate">
    <div>
      <div class="eyebrow">CLASSROOM QUIZ · 6학년 2학기 과학 정리 활동</div>
      <h1>🎡 룰렛 뽑기 팀 대항전</h1>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="themeBtn" type="button">🌓 테마</button>
      <button class="iconbtn" id="fsBtn" type="button">⛶ 전체화면</button>
    </div>
  </div>

  <div class="layout">
    <!-- 팀 스코어보드 -->
    <div class="panel-box">
      <div class="eyebrow" style="margin-bottom:8px;">팀 스코어보드</div>
      <div class="team-setup">
        <label style="font-size:.85rem; display:flex; align-items:center; gap:6px;">모둠 수
          <input type="number" id="teamCount" min="2" max="6" value="4">
        </label>
        <button id="regenBtn" type="button">모둠 다시 만들기</button>
      </div>
      <div class="team-list" id="teamList"></div>
    </div>

    <!-- 룰렛 -->
    <div class="panel-box wheel-area">
      <div class="turn-badge" id="turnBadge">지금은 <b>1모둠</b> 차례예요!</div>
      <div class="wheel-stage">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
          <div id="wheelLabels"></div>
        </div>
        <div class="wheel-hub">🎯</div>
      </div>
      <button class="spin-btn" id="spinBtn" type="button">🎡 룰렛 돌리기</button>
      <div class="progress-note" id="progressNote">문제 0 / 10 완료</div>
    </div>
  </div>

  <p class="hint">문제 내용은 파일 상단 QUESTIONS / SEGMENTS 배열을 수정해 다음 차시 것으로 바꿔 쓸 수 있어요. 더블찬스 칸에 걸리면 같은 모둠이 한 번 더 돌리고, 꽝 칸은 다음 모둠으로 순서가 넘어갑니다.</p>

  <!-- 결과 모달 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="tag" id="modalTag">QUESTION</div>
      <h2 id="modalTitle">10점 문제!</h2>
      <div class="qtext" id="modalQtext"></div>
      <div class="atext" id="modalAtext"></div>
      <div class="btnrow">
        <button class="btn" id="showAnswerBtn" type="button">👀 정답 보기</button>
        <button class="btn secondary" id="closeModalBtn" type="button" style="display:none;">닫고 계속하기</button>
      </div>
      <div class="award-row" id="awardRow"></div>
    </div>
  </div>

<script>
(function(){
  // ▼▼▼ 문제 내용 (1차시 태양 고도 측정기 기준). 다음 차시로 넘어가면 이 배열만 바꿔 쓰세요. ▼▼▼
  const QUESTIONS = [
    { q:"태양의 높이를 나타내는 값을 무엇이라고 할까요?", a:"태양 고도" },
    { q:"태양 고도를 측정할 때, 막대기 끝에 묶은 실이 그림자와 이루는 각을 무엇으로 읽나요?", a:"각도기" },
    { q:"막대기 길이가 2배가 되면 그림자 길이는 어떻게 될까요?", a:"그림자도 2배로 길어져요 (막대와 그림자의 비율은 항상 일정!)" },
    { q:"태양이 하루 동안 움직이는 것처럼 보이는 진짜 이유는 무엇일까요?", a:"지구가 자전하기 때문이에요" },
    { q:"하루 동안 태양은 어느 방향에서 떠서 어느 방향으로 질까요?", a:"동쪽에서 떠서 남쪽 하늘을 지나 서쪽으로 져요" },
    { q:"태양 고도가 하루 중 가장 높을 때는 대략 몇 시경일까요?", a:"낮 12시 무렵(남중 시각)" },
    { q:"그림자로 시간과 계절을 알 수 있었던 조선시대의 해시계는 무엇일까요?", a:"앙부일구" },
    { q:"태양광 발전소에서 태양 고도에 따라 패널 각도를 자동으로 맞춰 주는 장치는?", a:"태양광 추적 장치(솔라 트래커)" },
    { q:"태양 고도 측정기가 기울어져 있으면 어떤 문제가 생길까요?", a:"그림자 길이가 왜곡되어 정확한 각도를 잴 수 없어요(오차 발생)" },
    { q:"태양을 관찰할 때 절대로 하면 안 되는 행동은 무엇일까요?", a:"태양을 직접 눈으로 쳐다보는 것 (눈 손상 위험!)" }
  ];
  // 12칸 룰렛 배치: 문제 인덱스(points) + 더블찬스 + 꽝
  const SEGMENTS = [
    { type:'question', qi:0, points:10 },
    { type:'question', qi:1, points:20 },
    { type:'double' },
    { type:'question', qi:2, points:10 },
    { type:'question', qi:3, points:30 },
    { type:'question', qi:4, points:20 },
    { type:'blank' },
    { type:'question', qi:5, points:10 },
    { type:'question', qi:6, points:30 },
    { type:'question', qi:7, points:20 },
    { type:'question', qi:8, points:10 },
    { type:'question', qi:9, points:30 }
  ];
  // ▲▲▲ 여기까지 문제 내용 ▲▲▲

  const COLORS = ['#c8720f','#2f7d54','#2a6fdb','#8a5cc9','#c8402f'];
  const DOUBLE_COLOR = '#e0b400';
  const BLANK_COLOR = '#7a7266';
  const SEG_ANGLE = 360 / SEGMENTS.length;

  let teams = [];
  let currentTeamIndex = 0;
  let doubleActive = false;
  let currentRotation = 0;
  let spinning = false;
  let currentSegIndex = null;

  const wheel = document.getElementById('wheel');
  const wheelLabels = document.getElementById('wheelLabels');
  const spinBtn = document.getElementById('spinBtn');
  const turnBadge = document.getElementById('turnBadge');
  const progressNote = document.getElementById('progressNote');
  const teamCountInput = document.getElementById('teamCount');
  const regenBtn = document.getElementById('regenBtn');
  const teamList = document.getElementById('teamList');

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTag = document.getElementById('modalTag');
  const modalTitle = document.getElementById('modalTitle');
  const modalQtext = document.getElementById('modalQtext');
  const modalAtext = document.getElementById('modalAtext');
  const showAnswerBtn = document.getElementById('showAnswerBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const awardRow = document.getElementById('awardRow');

  function segLabel(seg){
    if(seg.type === 'double') return '2배';
    if(seg.type === 'blank') return '꽝';
    return seg.points + '점';
  }
  function segColor(seg, i){
    if(seg.type === 'double') return DOUBLE_COLOR;
    if(seg.type === 'blank') return BLANK_COLOR;
    return COLORS[i % COLORS.length];
  }

  function buildWheel(){
    let gradientParts = [];
    wheelLabels.innerHTML = '';
    SEGMENTS.forEach((seg, i)=>{
      const start = i * SEG_ANGLE;
      const end = start + SEG_ANGLE;
      const color = segColor(seg, i);
      gradientParts.push(color + ' ' + start + 'deg ' + end + 'deg');

      const labelWrap = document.createElement('div');
      labelWrap.className = 'wheel-label';
      labelWrap.style.transform = 'rotate(' + (start + SEG_ANGLE/2) + 'deg)';
      labelWrap.id = 'seg-' + i;
      const span = document.createElement('span');
      span.textContent = segLabel(seg) + (seg.type==='question' && seg.used ? ' ✔' : '');
      labelWrap.appendChild(span);
      wheelLabels.appendChild(labelWrap);
    });
    wheel.style.background = 'conic-gradient(' + gradientParts.join(', ') + ')';
    refreshUsedLabels();
  }

  function refreshUsedLabels(){
    SEGMENTS.forEach((seg, i)=>{
      const el = document.getElementById('seg-'+i);
      if(!el) return;
      const span = el.querySelector('span');
      span.textContent = segLabel(seg) + (seg.type==='question' && seg.used ? ' ✔' : '');
      el.style.opacity = (seg.type==='question' && seg.used) ? '0.45' : '1';
    });
  }

  function updateProgressNote(){
    const done = SEGMENTS.filter(s=>s.type==='question' && s.used).length;
    const total = SEGMENTS.filter(s=>s.type==='question').length;
    progressNote.textContent = '문제 ' + done + ' / ' + total + ' 완료';
  }

  function makeDefaultTeams(n){
    const arr = [];
    for(let i=0;i<n;i++){ arr.push({ name: (i+1)+'모둠', score:0 }); }
    return arr;
  }

  function renderTeams(){
    teamList.innerHTML = '';
    const maxScore = Math.max(...teams.map(t=>t.score));
    teams.forEach((t, i)=>{
      const card = document.createElement('div');
      card.className = 'team-card' + (t.score === maxScore && maxScore > 0 ? ' leading' : '');
      const nameInput = document.createElement('input');
      nameInput.className = 'team-name';
      nameInput.value = t.name;
      nameInput.addEventListener('input', ()=>{ t.name = nameInput.value || ((i+1)+'모둠'); updateTurnBadge(); });

      const ctrl = document.createElement('div');
      ctrl.className = 'team-score-ctrl';

      const minus = document.createElement('button');
      minus.className = 'pm-btn'; minus.type='button'; minus.textContent = '−';
      minus.addEventListener('click', ()=>{ t.score = Math.max(0, t.score - 10); renderTeams(); });

      const scoreEl = document.createElement('span');
      scoreEl.className = 'team-score';
      scoreEl.textContent = (t.score===maxScore && maxScore>0 ? '👑 ' : '') + t.score;

      const plus = document.createElement('button');
      plus.className = 'pm-btn'; plus.type='button'; plus.textContent = '+';
      plus.addEventListener('click', ()=>{ t.score += 10; renderTeams(); });

      ctrl.appendChild(minus); ctrl.appendChild(scoreEl); ctrl.appendChild(plus);
      card.appendChild(nameInput); card.appendChild(ctrl);
      teamList.appendChild(card);
    });
  }

  function updateTurnBadge(){
    const t = teams[currentTeamIndex];
    turnBadge.innerHTML = doubleActive
      ? '🌟 <b>' + t.name + '</b> 더블찬스! 한 번 더 돌리세요'
      : '지금은 <b>' + t.name + '</b> 차례예요!';
  }

  function resetGame(){
    const n = Math.min(6, Math.max(2, parseInt(teamCountInput.value,10) || 4));
    teamCountInput.value = n;
    teams = makeDefaultTeams(n);
    currentTeamIndex = 0;
    doubleActive = false;
    SEGMENTS.forEach(s=>{ if(s.type==='question') s.used = false; });
    currentRotation = 0;
    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(0deg)';
    requestAnimationFrame(()=>{ wheel.style.transition = ''; });
    buildWheel();
    renderTeams();
    updateTurnBadge();
    updateProgressNote();
    spinBtn.disabled = false;
    spinBtn.textContent = '🎡 룰렛 돌리기';
  }

  function pickSegmentIndex(){
    const candidates = [];
    SEGMENTS.forEach((s, i)=>{
      if(s.type !== 'question' || !s.used) candidates.push(i);
    });
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function spin(){
    if(spinning) return;
    const remaining = SEGMENTS.filter(s=>s.type==='question' && !s.used).length;
    if(remaining === 0){ finishGame(); return; }

    spinning = true;
    spinBtn.disabled = true;
    const segIndex = pickSegmentIndex();
    currentSegIndex = segIndex;
    const center = segIndex * SEG_ANGLE + SEG_ANGLE/2;
    const base = (360 - center) % 360;
    const diff = ((base - (currentRotation % 360)) + 360) % 360;
    const extraSpins = 5;
    currentRotation += diff + 360 * extraSpins;
    wheel.style.transform = 'rotate(' + currentRotation + 'deg)';

    setTimeout(()=>{
      spinning = false;
      handleLanding(segIndex);
    }, 3300);
  }

  function handleLanding(segIndex){
    const seg = SEGMENTS[segIndex];
    if(seg.type === 'double'){
      doubleActive = true;
      updateTurnBadge();
      spinBtn.disabled = false;
      showSimpleModal('DOUBLE CHANCE', '🌟 더블찬스!', '다음 문제 점수가 두 배가 됩니다. 같은 모둠이 한 번 더 룰렛을 돌리세요!');
      return;
    }
    if(seg.type === 'blank'){
      showSimpleModal('OOPS', '😅 꽝!', '이번엔 아무 일도 일어나지 않았어요. 다음 모둠에게 순서가 넘어갑니다.', ()=>{
        advanceTurn();
      });
      return;
    }
    // question
    openQuestionModal(seg);
  }

  function showSimpleModal(tag, title, text, onClose){
    modalTag.textContent = tag;
    modalTitle.textContent = title;
    modalQtext.textContent = text;
    modalAtext.style.display = 'none';
    showAnswerBtn.style.display = 'none';
    closeModalBtn.style.display = '';
    awardRow.style.display = 'none';
    modalBackdrop.classList.add('show');
    closeModalBtn.onclick = ()=>{
      modalBackdrop.classList.remove('show');
      spinBtn.disabled = false;
      if(onClose) onClose();
    };
  }

  function openQuestionModal(seg){
    const q = QUESTIONS[seg.qi];
    const pts = doubleActive ? seg.points * 2 : seg.points;
    modalTag.textContent = 'QUESTION · ' + pts + '점' + (doubleActive ? ' (더블!)' : '');
    modalTitle.textContent = pts + '점 문제!';
    modalQtext.textContent = q.q;
    modalAtext.style.display = 'none';
    modalAtext.textContent = '정답: ' + q.a;
    showAnswerBtn.style.display = '';
    closeModalBtn.style.display = 'none';
    awardRow.style.display = 'none';
    modalBackdrop.classList.add('show');

    showAnswerBtn.onclick = ()=>{
      modalAtext.style.display = '';
      showAnswerBtn.style.display = 'none';
      awardRow.style.display = 'flex';
      awardRow.innerHTML = '';
      teams.forEach((t, i)=>{
        const b = document.createElement('button');
        b.textContent = '✅ ' + t.name + ' 정답';
        b.addEventListener('click', ()=>{
          t.score += pts;
          seg.used = true;
          doubleActive = false;
          finalizeRound();
        });
        awardRow.appendChild(b);
      });
      const skip = document.createElement('button');
      skip.className = 'skip';
      skip.textContent = '아무도 못 맞힘';
      skip.addEventListener('click', ()=>{
        seg.used = true;
        doubleActive = false;
        finalizeRound();
      });
      awardRow.appendChild(skip);
    };
  }

  function finalizeRound(){
    modalBackdrop.classList.remove('show');
    renderTeams();
    refreshUsedLabels();
    updateProgressNote();
    advanceTurn();
    const remaining = SEGMENTS.filter(s=>s.type==='question' && !s.used).length;
    if(remaining === 0){ setTimeout(finishGame, 300); }
    else { spinBtn.disabled = false; }
  }

  function advanceTurn(){
    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
    updateTurnBadge();
  }

  function finishGame(){
    const maxScore = Math.max(...teams.map(t=>t.score));
    const winners = teams.filter(t=>t.score === maxScore).map(t=>t.name).join(', ');
    modalTag.textContent = 'GAME OVER';
    modalTitle.textContent = '🎉 모든 문제 끝!';
    modalQtext.textContent = '오늘의 우승 모둠: ' + winners + ' (' + maxScore + '점)';
    modalAtext.style.display = 'none';
    showAnswerBtn.style.display = 'none';
    closeModalBtn.style.display = '';
    closeModalBtn.textContent = '확인';
    awardRow.style.display = 'none';
    modalBackdrop.classList.add('show');
    closeModalBtn.onclick = ()=>{ modalBackdrop.classList.remove('show'); closeModalBtn.textContent = '닫고 계속하기'; };
    spinBtn.disabled = true;
    spinBtn.textContent = '🏁 게임 종료';
  }

  spinBtn.addEventListener('click', spin);
  regenBtn.addEventListener('click', resetGame);

  document.getElementById('themeBtn').addEventListener('click', ()=>{
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme');
    if(cur === 'dark'){ root.setAttribute('data-theme','light'); }
    else if(cur === 'light'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','dark'); }
  });
  document.getElementById('fsBtn').addEventListener('click', ()=>{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else{ document.exitFullscreen().catch(()=>{}); }
  });

  resetGame();
})();
</script>
</body>
</html>
